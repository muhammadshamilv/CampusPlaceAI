{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Institution Access Request | CampusPlaceAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">
      CampusPlace<span>AI</span>
    </a>
  </div>
</nav>

<!-- FORM SECTION -->
<section class="form-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7 col-12">

        <div class="form-card">
          <h4 class="text-center fw-bold mb-3">
            Institution Access Request
          </h4>

          <!-- FORM (DB connection will be added later) -->
          {% if success %}
          <div class="alert alert-success">
              Your request has been submitted. Our team will contact you after approval.
          </div>
          {% endif %}
          
          <form method="post">
            {% csrf_token %}

            <div class="mb-3">
              <label class="form-label">Institution Name</label>
              <input type="text" name="institution_name" class="form-control"
                     placeholder="College / University name" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Official Email</label>
              <input type="email" name="email" class="form-control"
                     placeholder="admin@college.edu" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Contact Person</label>
              <input type="text" name="contact_person" class="form-control"
                     placeholder="Placement Officer / Admin" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Institution Details</label>
              <textarea name="details" class="form-control"
                        rows="3" placeholder="Brief description"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Submit Request
            </button>
          </form>

          <p class="text-center mt-3">
            Already approved?
            <a href="{% url 'college_login' %}">Login here</a>
          </p>

        </div>

      </div>
    </div>
  </div>
</section>

{% include "common/messages.html" %}


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
