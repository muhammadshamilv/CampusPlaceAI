{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Administrator Login | CampusPlaceAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">
      CampusPlace<span>AI</span>
    </a>
  </div>
</nav>

<section class="form-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6 col-12">
        <div class="form-card">
          <h4 class="text-center fw-bold mb-3">System Administrator Login</h4>

          <form method="post">
            {% csrf_token %}
          
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" name="email" class="form-control"
                     placeholder="admin@campusplace.ai" required>
            </div>
          
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control"
                     placeholder="••••••••">
            </div>
          
            <button type="submit" class="btn btn-primary w-100">
              Login
            </button>
          
            <p class="text-center mt-2">
              First time here?
              <a href="#" onclick="goToSetup()">Set your password</a>

            </p>
          
            {% if error %}
              <p class="text-danger text-center mt-2">{{ error }}</p>
            {% endif %}
          </form>
          

        </div>
      </div>
    </div>
  </div>
</section>

<script>
document.getElementById("firstLink").onclick=function(){
  const email=document.querySelector("input[name='email']").value;
  if(!email){ alert("Enter email first"); return; }
  window.location.href="/core/setup-password/?email="+email;
}
</script>


<script>
  function goToSetup(){
      const email = document.querySelector("input[name='email']").value.trim();
      if(!email){
          alert("Please enter your email first");
          return;
      }
      window.location.href = "/core/setup-password/?email=" + email + "&role=ADMIN";
  }
  </script>
  

</body>
</html>
