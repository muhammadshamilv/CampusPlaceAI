{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Post Job | CampusPlaceAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
<link rel="stylesheet" href="{% static 'css/forms.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">
      CampusPlace<span>AI</span>
    </a>
  </div>
</nav>

<div class="dashboard-container">

<!-- SIDEBAR -->
<aside class="sidebar">
  <h6 class="sidebar-title">System Admin</h6>

  <a href="{% url 'company_dashboard' %}">
    <i class="fa-solid fa-chart-pie"></i> Dashboard
  </a>

  <a href="{% url 'company_college_requests' %}">
    <i class="fa-solid fa-school"></i> Institution Requests
  </a>

  <a href="{% url 'company_add_student' %}">
    <i class="fa-solid fa-user-plus"></i> Add Student
  </a>

  <a href="{% url 'company_manage_students' %}">
    <i class="fa-solid fa-users"></i> Manage Students
  </a>

  <!-- Job Management -->
  <a href="{% url 'company_post_job' %}" class="active">
    <i class="fa-solid fa-plus"></i> Post Job
  </a>

  <a href="{% url 'company_view_jobs' %}">
    <i class="fa-solid fa-clipboard-list"></i> View Jobs
  </a>

  <a href="{% url 'company_selected_students' %}">
    <i class="fa-solid fa-user-check"></i> Selected Students
  </a>
  
  <a href="{% url 'home' %}" class="logout">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </a>
</aside>


<!-- Main -->
<main class="dashboard-content">
<h4 class="fw-bold mb-4">Post New Job</h4>

<div class="form-card form-card-wide">
<form method="post">
{% csrf_token %}

<div class="row g-3">

  <!-- Recruiting Company -->
  <div class="col-md-6">
    <label class="form-label">Recruiting Company</label>
    <input type="text" name="company_name" class="form-control" required>
  </div>

  <!-- Job Title -->
  <div class="col-md-6">
    <label class="form-label">Job Title</label>
    <input type="text" name="title" class="form-control" required>
  </div>

  <!-- Location -->
  <div class="col-md-6">
    <label class="form-label">Location</label>
    <input type="text" name="location" class="form-control" required>
  </div>

  <!-- Branch -->
  <div class="col-md-6">
    <label class="form-label">Branch (CSE, ECE, IT, etc.)</label>
    <input type="text" name="branch" class="form-control" required>
  </div>

  <!-- Eligibility -->
  <div class="col-md-6">
    <label class="form-label">Eligibility</label>
    <input type="text" name="eligibility" class="form-control" required>
  </div>
  
  <!--Skills-->
  <div class="col-md-6">
    <label class="form-label">Required Skills (comma separated)</label>
    <input type="text" name="required_skills" class="form-control" required>
  </div>

  <!-- Description -->
  <div class="col-md-12">
    <label class="form-label">Job Description</label>
    <textarea name="description" class="form-control" rows="4"></textarea>
  </div>

</div>

<div class="mt-4 text-end">
  <button type="submit" class="btn btn-primary">
    <i class="fa-solid fa-paper-plane"></i> Post Job
  </button>
</div>

</form>
</div>

</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
