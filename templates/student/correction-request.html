{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Correction Request | CampusPlaceAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">
      CampusPlace<span>AI</span>
    </a>
  </div>
</nav>

<!-- DASHBOARD LAYOUT -->
<div class="dashboard-container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h6 class="sidebar-title">Student</h6>

    <a href="{% url 'student_dashboard' %}">
      <i class="fa-solid fa-chart-pie"></i> Dashboard
    </a>

    <a href="{% url 'student_profile' %}">
      <i class="fa-solid fa-user"></i> View Profile
    </a>

    <a href="{% url 'student_correction_request' %}" class="active">
      <i class="fa-solid fa-pen"></i> Correction Request
    </a>

    <a href="{% url 'student_resume_analysis' %}">
      <i class="fa-solid fa-robot"></i> AI Resume Analysis
    </a>
    
    <a href="{% url 'home' %}" class="logout">
      <i class="fa-solid fa-right-from-bracket"></i> Logout
    </a>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="dashboard-content">
    <h4 class="fw-bold mb-4">Correction Request</h4>

    <div class="form-card form-card-wide">

      <form method="post">
        {% csrf_token %}
        <div id="successMessage" class="alert alert-success mt-3 d-none">
          Correction request submitted successfully.
        </div>

        <div class="mb-3">
          <label class="form-label">Field with Issue</label>
          <select class="form-select" name="field" required>
            <option value="">Select field</option>
            <option>Full Name</option>
            <option>Email</option>
            <option>Phone</option>
            <option>CGPA</option>
            <option>Backlogs</option>
            <option>Skills</option>
            <option>Courses</option>
            <option>Internship</option>
            <option>Resume</option>
            <option>Other</option>
          </select>
        </div>
        

        <div class="mb-3">
          <label class="form-label">Correct Information</label>
          <input type="text" name="correct_value" class="form-control" placeholder="Enter corrected value" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea name="message" class="form-control" rows="3" placeholder="Explain the correction request"></textarea>
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-primary">
            Submit Request
          </button>
        </div>

      </form>

    </div>

  </main>

</div>

{% include "common/messages.html" %}


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/student.js' %}"></script>
</body>
</html>
